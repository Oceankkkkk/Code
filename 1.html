<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>name</title>

  <body>
    <h1>My First WebPage</h1>
    <h2>Made by <i>Oceankkkkk</i></h2>
    <svg width="10800" height="21600" id="background"></svg>
    <script>
      document.body.style.backgroundColor="forestgreen";
      for(let j=1;j<=3;j++) {
        let ny=j*70;
        for(let i=1;i<=18;i++) {
          let nx=i*130;
          document.getElementById("background").innerHTML+=`<rect x="${nx}" y="${ny}" width="60" height="120" fill="white" stroke="black" stroke-width="10" rx="5" ry="5"></rect>`;
        }
      }
    </script>
  </body>
